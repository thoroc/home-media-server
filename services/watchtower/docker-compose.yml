services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    hostname: watchtower.lan
    labels:
      - traefik.enable=true
      - traefik.http.routers.watchtower.rule=Host(`watchtower.lan`)
    networks:
      - high-seas
    command:
      - --cleanup=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped